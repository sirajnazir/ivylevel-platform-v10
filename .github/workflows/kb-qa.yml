name: KB QA

on:
  pull_request:
    paths:
      - 'tools/ingest/**'
      - 'services/jenny-api/**'
      - 'tools/qa/**'
      - 'data/kb_intel_chips/**'
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggers

jobs:
  smoke-tests:
    name: Smoke Tests (Quick Validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai pinecone-client

      - name: Run smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: jenny-v3-3072-093025
          NS_SESS: KBv6_2025-10-06_v1.0
          NS_IMSG: KBv6_iMessage_2025-10-07_v1.0
        run: |
          chmod +x tools/qa/smoke_tests.sh
          ./tools/qa/smoke_tests.sh

  deployment-version-check:
    name: Deployment Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pinecone-client

      - name: Check deployment version
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: jenny-v3-3072-093025
          NS_SESS: KBv6_2025-10-06_v1.0
          NS_IMSG: KBv6_iMessage_2025-10-07_v1.0
        run: |
          python3 tools/qa/check_deployment_version.py

  full-qa-suite:
    name: Full QA Suite (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai pinecone-client

      - name: Run full QA suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: jenny-v3-3072-093025
          NS_SESS: KBv6_2025-10-06_v1.0
          NS_IMSG: KBv6_iMessage_2025-10-07_v1.0
          TOP1_MIN: "0.50"
          TOP1_MIN_IMSG: "0.48"
          TOP3_COVERAGE: "1.00"
          OUTLIER_MAX: "0.02"
          DRIFT_MAX: "0.02"
        run: |
          chmod +x tools/qa/run_qa_suite.sh tools/qa/*.py
          ./tools/qa/run_qa_suite.sh

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ github.run_number }}
          path: data/kb_intel_chips/qa_runs/
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ KB QA Suite failed. Please review the [QA artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

  drift-watch:
    name: Drift Watch (Count Monitoring)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pinecone-client

      - name: Run drift check
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: jenny-v3-3072-093025
          NS_SESS: KBv6_2025-10-06_v1.0
          NS_IMSG: KBv6_iMessage_2025-10-07_v1.0
          DRIFT_MAX: "0.02"
        run: |
          python3 tools/qa/check_drift.py

      - name: Upload drift reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_number }}
          path: data/kb_intel_chips/qa_runs/drift_*/
          retention-days: 90
