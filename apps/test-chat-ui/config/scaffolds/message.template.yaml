id: scaffold.message.template
priority: 75
requires:
  anyTag:
    - message_template
    - lor_cadence
    - micro_interaction
  anyType:
    - Message_Template_Chip
    - Micro_Tactic_Chip
select:
  topChip:
    preferType: Message_Template_Chip
    fallbackTopK: 5
template: |
  ## Thank-You Note Template

  ```
  Hello [Teacher's Name]—

  So grateful for your mentorship this year. Quick context: [e.g., the USC portal accepts PDF uploads / deadline is Friday 5pm].

  If it's okay, could we finalize by [Day hh:mm]? If not, any time this week works.

  Thank you again for everything!
  Best,
  [Your Name]
  ```

  **Template derived from**: {{topChip.id}} @ {{topChip.namespace}}

  **Placeholders to fill**:
  - `[Teacher's Name]`: Your recommender's name
  - `[Day hh:mm]`: Specific deadline
  - `[Your Name]`: Your signature

  **Why this works**: Gratitude opener + specific context + flexible ask + warm close. Keeps it professional but personal.
outputs:
  chips:
    - "{{topChip.id}}"
